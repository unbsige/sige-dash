[project]
name = "sige-dash"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "environs>=14.3.0",
    "httpx[brotli]>=0.28.1",
    "lightgbm==4.6.*",
    "matplotlib==3.10.*",
    "numpy==2.2.*",
    "pandas==2.3.*",
    "pipx==1.7.*",
    "plotly==6.3.*",
    "prophet==1.1.*",
    "python-dotenv==1.1.*",
    "rich==14.1.*",
    "ruff>=0.12.12",
    "scikit-learn==1.7.*",
    "scikit-lego>=0.9.5",
    "seaborn==0.13.*",
    "skforecast==0.17.*",
    "statsmodels==0.14.*",
    "streamlit==1.49.*",
    "xgboost==3.0.*",
]


[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb"]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
    "data/",
    "models/",
    "experiments/",
    ".draft/",
    ".figures/",
    "checkpoints/",
    "logs/",
    "outputs/",
    "artifacts/",
    "*.egg-info/",
]

line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PD",   # pandas-vet
    "NPY",  # numpy-specific rules
    "PL",   # pylint
    "RUF",  # ruff-specific rules
    "TRY",  # tryceratops
    "FBT",  # flake8-boolean-trap
    "PIE",  # flake8-pie
    "PERF", # perflint
]

ignore = [
    "E261",    # At least two spaces before inline comment
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "T201",    # print statements (common in notebooks)
    "S101",    # Use of assert (common in tests and notebooks)
    "PD901",   # df is a bad variable name (common in DS)
    "N803",    # Argument name should be lowercase (sklearn uses X, y)
    "N806",    # Variable in function should be lowercase (X, y are standard)
    "E501",    # Line too long (let formatter handle this)
    "UP007",   # Use X | Y for type unions (compatibility)
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside exception class
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default arg in function definition
    "PERF203", # try-except-in-loop
    "RUF012",  # Mutable class attributes should be annotated
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "E261",    # At least two spaces before inline comment
    "E402",    # Module level import not at top
    "F401",    # Imported but unused
    "F841",    # Local variable assigned but never used
    "T201",    # print statements
    "D",       # No mandatory docstrings
    "S101",    # assert statements
    "B007",    # Loop variable not used
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLW2901", # for loop variable overwritten
    "C901",    # Complex structure
    "N816",    # Variable should be lowercase
    "UP015",   # Unnecessary open mode parameters
    "PERF401", # Use list comprehension
    "RUF001",  # String contains ambiguous character
    "RUF002",  # Docstring contains ambiguous character
    "RUF003",  # Comment contains ambiguous character
]

"scripts/*" = [
    "T201",    # print statements allowed
    "S101",    # assert statements
    "D",       # optional docstrings
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
]

"tests/*" = [
    "S101",    # assert statements expected
    "ARG001",  # fixtures may not be used
    "D",       # optional docstrings in tests
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic values in tests are OK
    "S106",    # Possible hardcoded password
]

"setup.py" = ["D100"]
"conftest.py" = ["D100"]
"**/config.py" = ["D100", "S105", "S106"]
"**/settings.py" = ["D100", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = [
    "numpy",
    "pandas",
    "sklearn",
    "torch",
    "tensorflow",
    "matplotlib",
    "seaborn",
    "plotly",
    "jupyter",
    "ipython",
]
force-single-line = false
case-sensitive = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 20
max-returns = 10
max-statements = 80
max-public-methods = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "torch.nn.Module",
    "tensorflow.keras.Model",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# [tool.ruff.lint.pandas-vet]
# avoid-inplace = true

# [tool.ruff.lint.numpy]
# enforce-dtype-consistency = true
